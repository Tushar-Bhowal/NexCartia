name: Keep backend awake

# Render's free tier sleeps a service after 15 minutes without traffic, and the
# first visitor then waits ~20–50s for a cold start. Pinging every 10 minutes
# keeps it warm. Minutes are offset from :00 because GitHub delays scheduled
# runs most at the top of the hour.
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          BACKEND_URL: https://nexcartia.onrender.com
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$BACKEND_URL/"
